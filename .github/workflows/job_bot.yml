name: Job Bot

on:
  schedule:
    # Times are UTC. IST = UTC + 5:30
    - cron: "30 2 * * *"    # 8:00 AM IST - morning
    - cron: "30 8 * * *"    # 2:00 PM IST - afternoon
    - cron: "30 15 * * *"   # 9:00 PM IST - late evening
  workflow_dispatch: {}      # lets you trigger a manual run from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated state files back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json notify_state.json
          git diff --staged --quiet || git commit -m "Update bot state [skip ci]"
          git push
