# =========================================
# Job Bot Configuration
# Edit this file to change what jobs you see.
# No code changes needed for filter tweaks.
# =========================================

# --- Telegram ---
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"   # set as GitHub Actions secret, not here
  chat_id: "${TELEGRAM_CHAT_ID}"       # set as GitHub Actions secret, not here

# --- Sources to run (comment out / set enabled: false to disable) ---
sources:
  indeed:
    enabled: false   # Indeed blocks non-browser traffic (403 error). Not a quick fix - re-enable later if you want to tackle it.
    query: "software engineer"
    location: "Kerala, India"
  internshala:
    enabled: true
    categories:                          # matches internshala URL category slugs
      - "data-science"
      - "business-analyst"
      - "hr"
      - "digital-marketing"
    location: "kerala"
  technopark_infopark:
    enabled: false   # Site is JavaScript-rendered - a plain scrape can't see listings. Needs a headless browser to fix properly.
  kerala_gov:
    enabled: false   # Returned 0 jobs - likely JS-rendered too, or different page structure than expected.

# --- Filtering rules ---
filters:
  # Keywords - job title must contain at least one of these (case-insensitive)
  roles:
    - "data analyst"
    - "data science"
    - "data scientist"
    - "business analyst"
    - "business intelligence"
    - " bi "
    - "power bi"
    - "sql"
    - "hr "
    - "human resource"
    - "recruitment"
    - "talent acquisition"
    - "workforce"
    - "seo"
    - "digital marketing"
    - "search engine"
    - "dashboard"
    - "reporting analyst"
    - "kpi"
    - "analytics"
    - "machine learning"
    - "python"

  # Keywords that immediately disqualify a job if found in the title
  exclude_keywords:
    - "senior"
    - "lead"
    - "manager"
    - "10+ years"
    - "principal"

  employment_type:
    - "internship"
    - "full-time"

  # remote / hybrid / location substrings to accept (case-insensitive, partial match)
  locations:
    - "remote"
    - "hybrid"
    - "kerala"
    - "kochi"
    - "trivandrum"
    - "thiruvananthapuram"
    - "kozhikode"

  experience_level:
    - "entry"
    - "fresher"
    - "0-1 year"
    - "intern"

  # Only show jobs posted within this many days
  max_age_days: 5

# --- Output ---
output:
  max_jobs_per_message: 10

# --- Dedup ---
dedup:
  state_file: "seen_jobs.json"
  prune_after_days: 30