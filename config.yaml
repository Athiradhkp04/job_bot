# =========================================
# Job Bot Configuration
# Edit this file to change what jobs you see.
# No code changes needed for filter tweaks.
# =========================================

# --- Telegram ---
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"   # set as GitHub Actions secret, not here
  chat_id: "${TELEGRAM_CHAT_ID}"       # set as GitHub Actions secret, not here

# --- Sources to run (comment out / set enabled: false to disable) ---
sources:
  indeed:
    enabled: false   # Indeed blocks non-browser traffic (403 error). Not a quick fix - re-enable later if you want to tackle it.
    query: "software engineer"
    location: "Kerala, India"
  internshala:
    enabled: true
    categories:                          # matches internshala URL category slugs (internships)
      - "data-science"
      - "business-analyst"
      - "hr"
      - "digital-marketing"
      - "full-stack-development"
    fresher_job_categories:              # also pulls full-time FRESHER JOBS (not just internships) for these
      - "data-analyst"
      - "full-stack-development"
    location: "kerala"
    max_pages_per_category: 3            # how many pages deep to check per category (catches listings beyond page 1)
  technopark_infopark:
    enabled: false   # Site is JavaScript-rendered - a plain scrape can't see listings. Needs a headless browser to fix properly.
  kerala_gov:
    enabled: false   # Returned 0 jobs - likely JS-rendered too, or different page structure than expected.

# --- Filtering rules ---
# role_groups is the single source of truth for BOTH which jobs pass the
# filter AND what order they're prioritized in (list order = priority
# order - first group listed = highest priority).
#
# Each group:
#   keywords: broad set of phrasings to catch (e.g. "data scientist" and
#     "data science intern" are both covered so neither gets missed)
#   bypass_location_and_stipend: true = accept from ANYWHERE, any pay
#     (used for your top-priority core roles)
#   bypass_if_stipend_above: a LOWER-priority group can jump to top
#     priority if it pays above this monthly Rs figure
filters:
  role_groups:
    - name: "core"                       # Data Analyst / Data Scientist / Business Analyst - top priority
      bypass_location_and_stipend: true  # no location or stipend restriction at all
      keywords:
        - "data analyst"
        - "data analytics"
        - "data analysis"
        - "data scientist"
        - "data science"
        - "business analyst"
        - "business analytics"
        - "business intelligence"
        - " bi "
        - "power bi"
        - "kpi"
        - "dashboard"
        - "reporting analyst"
        - "machine learning"
        - "python"
        - "sql"
    - name: "seo"                        # Internship or fresher job only, location/stipend rules apply
      bypass_location_and_stipend: false
      keywords:
        - "seo"
        - "search engine optimization"
        - "search engine optimisation"
        - "search engine"
    - name: "hr"                         # Internship only (HR isn't in fresher_job_categories), location/stipend rules apply
      bypass_location_and_stipend: false
      keywords:
        - "hr "
        - "hr executive"
        - "hr intern"
        - "hr generalist"
        - "hr operations"
        - "human resource"
        - "human resources"
        - "recruitment"
        - "talent acquisition"
        - "workforce"
    - name: "full_stack"                 # Internship or fresher job, location/stipend rules apply
      bypass_location_and_stipend: false
      keywords:
        - "full stack"
        - "full-stack"
        - "fullstack"
        - "full stack developer"
        - "full stack development"
        - "mern stack"
        - "mean stack"
        - "mern"
        - "mean"
    - name: "digital_marketing"          # Lowest priority, but bypasses to top if it pays well
      bypass_location_and_stipend: false
      bypass_if_stipend_above: 12000     # >12k/month -> treat as top priority
      keywords:
        - "digital marketing"

  # Keywords that immediately disqualify a job if found in the title,
  # regardless of which role_group it matched
  exclude_keywords:
    - "senior"
    - "lead"
    - "manager"
    - "10+ years"
    - "principal"

  # Location rules: always_allow locations pass regardless of stipend.
  # conditional groups only pass if stipend exceeds min_stipend (in Rs/month).
  # Jobs with unparseable stipend text (e.g. "Competitive stipend") get the
  # benefit of the doubt and pass. "Unpaid" always fails any >0 threshold.
  # NOTE: only applies to role_groups where bypass_location_and_stipend is false.
  location_rules:
    always_allow:
      - "remote"
      - "hybrid"
      - "kerala"
      - "kochi"
      - "cochin"
      - "trivandrum"
      - "thiruvananthapuram"
      - "kozhikode"
      - "calicut"
    conditional:
      - min_stipend: 8000
        locations:
          - "chennai"
          - "coimbatore"
          - "bangalore"
          - "bengaluru"
          - "hyderabad"
          - "madurai"
          - "mysore"
          - "mysuru"
          - "vizag"
          - "visakhapatnam"
          - "vijayawada"
          - "puducherry"
          - "pondicherry"
          - "salem"
          - "tiruchirappalli"
          - "trichy"
          - "mangalore"
          - "mangaluru"
      - min_stipend: 15000
        locations:
          - "noida"

  # Only show jobs posted within this many days
  max_age_days: 7

# --- Output ---
output:
  max_jobs_per_message: 10

# --- Dedup ---
dedup:
  state_file: "seen_jobs.json"
  prune_after_days: 30