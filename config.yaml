# =========================================
# Job Bot Configuration
# Edit this file to change what jobs you see.
# No code changes needed for filter tweaks.
# =========================================

# --- Telegram ---
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"   # set as GitHub Actions secret, not here
  chat_id: "${TELEGRAM_CHAT_ID}"       # set as GitHub Actions secret, not here

# --- Sources to run (comment out / set enabled: false to disable) ---
sources:
  indeed:
    enabled: false   # Indeed blocks non-browser traffic (403 error). Not a quick fix - re-enable later if you want to tackle it.
    query: "software engineer"
    location: "Kerala, India"
  internshala:
    enabled: true
    categories:                          # matches internshala URL category slugs (internships)
      - "data-science"
      - "business-analyst"
      - "hr"
      - "digital-marketing"
    fresher_job_categories:              # also pulls full-time FRESHER JOBS (not just internships) for these
      - "data-analyst"
    location: "kerala"
  technopark_infopark:
    enabled: false   # Site is JavaScript-rendered - a plain scrape can't see listings. Needs a headless browser to fix properly.
  kerala_gov:
    enabled: false   # Returned 0 jobs - likely JS-rendered too, or different page structure than expected.

# --- Filtering rules ---
filters:
  # Keywords - job title must contain at least one of these (case-insensitive)
  roles:
    - "data analyst"
    - "data science"
    - "data scientist"
    - "business analyst"
    - "business intelligence"
    - " bi "
    - "power bi"
    - "sql"
    - "hr "
    - "human resource"
    - "recruitment"
    - "talent acquisition"
    - "workforce"
    - "seo"
    - "digital marketing"
    - "search engine"
    - "dashboard"
    - "reporting analyst"
    - "kpi"
    - "analytics"
    - "machine learning"
    - "python"

  # Keywords that immediately disqualify a job if found in the title
  exclude_keywords:
    - "senior"
    - "lead"
    - "manager"
    - "10+ years"
    - "principal"

  employment_type:
    - "internship"
    - "full-time"

  # Location rules: always_allow locations pass regardless of stipend.
  # conditional groups only pass if stipend exceeds min_stipend (in Rs/month).
  # Jobs with unparseable stipend text (e.g. "Competitive stipend") get the
  # benefit of the doubt and pass. "Unpaid" always fails any >0 threshold.
  location_rules:
    always_allow:
      - "remote"
      - "hybrid"
      - "kerala"
      - "kochi"
      - "cochin"
      - "trivandrum"
      - "thiruvananthapuram"
      - "kozhikode"
    conditional:
      - min_stipend: 8000
        locations:
          - "chennai"
          - "coimbatore"
          - "bangalore"
          - "bengaluru"
          - "hyderabad"
          - "madurai"
          - "mysore"
          - "mysuru"
          - "vizag"
          - "visakhapatnam"
          - "vijayawada"
          - "puducherry"
          - "pondicherry"
          - "salem"
          - "tiruchirappalli"
          - "trichy"
          - "mangalore"
          - "mangaluru"
      - min_stipend: 15000
        locations:
          - "noida"

  experience_level:
    - "entry"
    - "fresher"
    - "0-1 year"
    - "intern"

  # Only show jobs posted within this many days
  max_age_days: 5

# --- Priority ordering ---
# When there are more new matches than fit in one message, jobs in
# earlier tiers are kept and shown first; jobs in later tiers are the
# first to be cut. "bypass_if_stipend_above" lets a lower tier jump to
# top priority if it pays well enough (value is monthly Rs, annual
# salaries are auto-converted to monthly-equivalent for comparison).
priority:
  tiers:
    - name: "Data/Business Analytics & BI"
      keywords:
        - "data analyst"
        - "data analytics"
        - "data science"
        - "data scientist"
        - "business analyst"
        - "business analytics"
        - "business intelligence"
        - " bi "
        - "power bi"
        - "kpi"
        - "dashboard"
    - name: "SEO"
      keywords:
        - "seo"
        - "search engine"
    - name: "HR"
      keywords:
        - "hr "
        - "human resource"
        - "recruitment"
        - "talent acquisition"
        - "workforce"
    - name: "Digital Marketing"
      keywords:
        - "digital marketing"
      bypass_if_stipend_above: 12000   # if it pays > 12k/month, treat as top priority instead

# --- Output ---
output:
  max_jobs_per_message: 10

# --- Dedup ---
dedup:
  state_file: "seen_jobs.json"
  prune_after_days: 30