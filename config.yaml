# =========================================
# Job Bot Configuration
# Edit this file to change what jobs you see.
# No code changes needed for filter tweaks.
# =========================================

# --- Telegram ---
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"   # set as GitHub Actions secret, not here
  chat_id: "${TELEGRAM_CHAT_ID}"       # set as GitHub Actions secret, not here

# --- Sources to run (comment out / set enabled: false to disable) ---
sources:
  indeed:
    enabled: false   # Indeed blocks non-browser traffic (403 error). Not a quick fix - re-enable later if you want to tackle it.
    query: "software engineer"
    location: "Kerala, India"
  internshala:
    enabled: true
    categories:                          # matches internshala URL category slugs (internships)
      - "data-science"
      - "business-analyst"
      - "hr"
      - "digital-marketing"
      - "full-stack-development"
    fresher_job_categories:              # also pulls full-time FRESHER JOBS (not just internships) for these
      - "data-analyst"
      - "full-stack-development"
    location: "kerala"

    max_pages_per_category: 3            # how many pages deep to check per category (catches listings beyond page 1)
  technopark_infopark:
    enabled: false   # Site is JavaScript-rendered - a plain scrape can't see listings. Needs a headless browser to fix properly.
  kerala_gov:
    enabled: false   # Returned 0 jobs - likely JS-rendered too, or different page structure than expected.

# --- Filtering rules ---
# role_groups is the single source of truth for BOTH which jobs pass the
# filter AND what order they're prioritized in (list order = priority
# order - first group listed = highest priority).
#
# Each group:
#   keywords: broad set of phrasings to catch (e.g. "data scientist" and
#     "data science intern" are both covered so neither gets missed)
#   bypass_location_and_stipend: true = accept from ANYWHERE, any pay
#     (used for your top-priority core roles)
#   bypass_if_stipend_above: a LOWER-priority group can jump to top
#     priority if it pays above this monthly Rs figure
filters:
  role_groups:
    - name: "core"                       # Data Analyst / Data Scientist / Business Analyst / BI / MIS - top priority
      bypass_location_and_stipend: true  # no location or stipend restriction at all
      keywords:
        - "data analyst"
        - "data analytics"
        - "data analysis"
        - "data scientist"
        - "data science"
        - "business analyst"
        - "business analytics"
        - "business intelligence"
        - " bi "
        - "bi analyst"
        - "bi developer"
        - "power bi"
        - "kpi"
        - "dashboard"
        - "reporting analyst"
        - "mis analyst"
        - "mis executive"
        - "insights analyst"
        - "junior data analyst"
        - "associate data analyst"
        - "machine learning"
        - "python"
        - "sql"
    - name: "seo"                        # Internship or fresher job only, location/stipend rules apply
      bypass_location_and_stipend: false
      keywords:
        - "seo"
        - "seo analyst"
        - "seo executive"
        - "seo specialist"
        - "seo consultant"
        - "seo auditor"
        - "search engine optimization"
        - "search engine optimisation"
        - "search engine"
    - name: "analyst_adjacent"           # Marketing/Product/Research/RevOps analysts - real skill overlap per resume
      bypass_location_and_stipend: false
      keywords:
        - "marketing analyst"
        - "digital marketing analyst"
        - "web analytics analyst"
        - "web analytics"
        - "growth analyst"
        - "revops analyst"
        - "revenue operations analyst"
        - "sales operations analyst"
        - "sales ops analyst"
        - "product analyst"
        - "research analyst"
        - "market research analyst"
    - name: "hr"                         # Internship only (HR isn't in fresher_job_categories), location/stipend rules apply
      bypass_location_and_stipend: false
      keywords:
        - "hr "
        - "hr executive"
        - "hr intern"
        - "hr generalist"
        - "hr operations"
        - "hr analyst"
        - "human resource"
        - "human resources"
        - "people analytics"
        - "talent analytics"
        - "recruitment"
        - "recruitment analytics"
        - "talent acquisition"
        - "workforce"
    - name: "full_stack"                 # Internship or fresher job, location/stipend rules apply
      bypass_location_and_stipend: false
      keywords:
        - "full stack"
        - "full-stack"
        - "fullstack"
        - "full stack developer"
        - "full stack development"
        - "mern stack"
        - "mean stack"
        - "mern"
        - "mean"
    - name: "digital_marketing"          # Lowest of the "named" tiers, but bypasses to top if it pays well
      bypass_location_and_stipend: false
      bypass_if_stipend_above: 10000     # >10k/month -> treat as top priority
      keywords:
        - "digital marketing"
        - "marketing automation"
        - "marketing automation analyst"
        - "growth automation"
    - name: "generic_analyst_catchall"   # Broad titles ("Junior Analyst") - real noise risk, kept lowest priority
      bypass_location_and_stipend: false
      keywords:
        - "junior analyst"
        - "associate analyst"

  # Keywords that immediately disqualify a job if found in the title,
  # regardless of which role_group it matched
  exclude_keywords:
    - "senior"
    - "lead"
    - "manager"
    - "10+ years"
    - "principal"
    # Cross-industry noise: generic titles like "Research Analyst" and
    # "Business Analyst" get reused across totally unrelated fields.
    # These exclude the most common false-positive domains.
    - "equity research"
    - "equity analyst"
    - "investment analyst"
    - "financial analyst"
    - "credit analyst"
    - "actuary"
    - "actuarial"
    - "insurance claims"
    - "underwriter"
    - "clinical"
    - "pharma"
    - "pharmaceutical"
    - "hospital"
    - "nurse"
    - "nursing"
    - "medical device"
    - "healthcare operations"
    - "law firm"
    - "attorney"
    - "legal counsel"
    - "paralegal"
    - "litigation"

  # Locations to reject ALWAYS - applies even to role_groups with
  # bypass_location_and_stipend: true (e.g. core roles). This is a hard
  # "never show me this" rule, separate from location_rules below.
  excluded_locations:
    - "maharashtra"
    - "mumbai"
    - "pune"
    - "nagpur"
    - "nashik"
    - "thane"
    - "navi mumbai"
    - "aurangabad"
    - "kolhapur"

  # Location rules: always_allow locations pass regardless of stipend.
  # conditional groups only pass if stipend exceeds min_stipend (in Rs/month).
  # Jobs with unparseable stipend text (e.g. "Competitive stipend") get the
  # benefit of the doubt and pass. "Unpaid" always fails any >0 threshold.
  # NOTE: only applies to role_groups where bypass_location_and_stipend is false.
  location_rules:
    always_allow:
      - "remote"
      - "hybrid"
      - "kerala"
      - "kochi"
      - "cochin"
      - "trivandrum"
      - "thiruvananthapuram"
      - "kozhikode"
      - "calicut"
    conditional:
      - min_stipend: 8000
        locations:
          - "chennai"
          - "coimbatore"
          - "bangalore"
          - "bengaluru"
          - "hyderabad"
          - "madurai"
          - "mysore"
          - "mysuru"
          - "vizag"
          - "visakhapatnam"
          - "vijayawada"
          - "puducherry"
          - "pondicherry"
          - "salem"
          - "tiruchirappalli"
          - "trichy"
          - "mangalore"
          - "mangaluru"
      - min_stipend: 15000
        locations:
          - "noida"
          - "Guwahati"
          - "Noida"

  # Secondary sort order WITHIN each role_group's priority tier - doesn't
  # affect whether a job passes the filter, only what order matching jobs
  # show up in. Lower rank = shown first.
  #   rank: fixed rank, always applies once location matches
  #   min_stipend + rank_if_above/rank_if_below: conditional rank depending
  #     on whether the job's monthly-equivalent stipend clears the bar
  #   default_rank: used for anything that doesn't match a listed tier
  #     (this is your "rest should be same" case), and for Remote/Hybrid
  #     jobs with no specific city attached
  location_priority:
    default_rank: 3
    tiers:
      - name: "kerala"
        rank: 0
        locations:
          - "kerala"
          - "kochi"
          - "cochin"
          - "trivandrum"
          - "thiruvananthapuram"
          - "kozhikode"
          - "calicut"
      - name: "bangalore_mysore"
        rank: 1
        locations:
          - "bangalore"
          - "bengaluru"
          - "mysore"
          - "mysuru"
      - name: "tamil_nadu"
        min_stipend: 8000
        rank_if_above: 2       # pays well -> priority boost
        rank_if_below: null    # doesn't clear bar -> falls to default_rank (null = use default_rank)
        locations:
          - "chennai"
          - "coimbatore"
          - "madurai"
          - "salem"
          - "tiruchirappalli"
          - "trichy"
          - "tamil nadu"
          - "vellore"
          - "erode"
          - "tirupur"
      - name: "north_india"
        min_stipend: 15000
        rank_if_above: null    # pays well -> no longer penalized, falls to default_rank
        rank_if_below: 4       # doesn't clear bar -> deprioritized
        locations:
          - "delhi"
          - "new delhi"
          - "noida"
          - "gurgaon"
          - "gurugram"
          - "uttar pradesh"
          - "punjab"
          - "haryana"
          - "rajasthan"
          - "bihar"
          - "jharkhand"
          - "madhya pradesh"
          - "chandigarh"
          - "lucknow"
          - "jaipur"
          - "kanpur"
          - "indore"
          - "bhopal"
          - "patna"
          - "jabalpur"
          - "ghaziabad"
          - "faridabad"
          - "dehradun"
          - "uttarakhand"
          - "himachal"
          - "jammu"
          - "kashmir"
          - "gwalior"
          - "ahmedabad"
          - "gujarat"
          - "surat"

  # Only show jobs posted within this many days
  max_age_days: 7

# --- Output ---
output:
  min_jobs_per_message: 10
  max_jobs_per_message: 15

# --- Digest (full refresh check-in) ---
# If no genuinely new jobs have been sent for this many days, send a
# full snapshot of everything CURRENTLY matching your filters (ignoring
# dedup) instead of staying silent - a reassurance that the bot is
# still working during quiet stretches, not just repeated spam.
digest:
  enabled: true
  trigger_after_days_no_new: 2
  state_file: "notify_state.json"

# --- Dedup ---
dedup:
  state_file: "seen_jobs.json"
  prune_after_days: 10